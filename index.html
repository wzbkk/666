<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简单计算器</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef2f8; color: #19243a; font-family: system-ui, sans-serif; }
    main { width: min(360px, 92vw); padding: 24px; background: white; border-radius: 24px; box-shadow: 0 16px 50px #19243a18; }
    h1 { margin: 0 0 20px; font-size: 22px; }
    output { display: block; padding: 22px 12px; margin-bottom: 18px; border-radius: 12px; background: #f4f6fa; text-align: right; font-size: 32px; overflow-wrap: anywhere; min-height: 88px; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { border: 0; border-radius: 12px; min-height: 58px; background: #edf0f6; color: inherit; font: inherit; font-size: 22px; cursor: pointer; }
    button:hover { filter: brightness(.94); }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #819bff; outline-offset: 2px; }
    .operator { background: #e3eaff; color: #3457cc; }
    .equals { background: #3457cc; color: white; grid-row: span 2; }
    .zero { grid-column: span 2; }
    p { margin: 18px 0 0; font-size: 12px; color: #68758b; text-align: center; }
  </style>
</head>
<body>
  <main aria-label="计算器">
    <h1>简单计算器</h1>
    <output id="display" aria-live="polite" aria-label="计算结果">0</output>
    <div class="keys">
      <button data-key="clear">AC</button><button data-key="backspace" aria-label="退格">⌫</button><button data-key="sign" aria-label="切换正负号">±</button><button class="operator" data-key="/">÷</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="operator" data-key="*">×</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="operator" data-key="-">−</button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="operator" data-key="+">+</button>
      <button class="zero" data-key="0">0</button><button data-key=".">.</button><button class="equals" data-key="=">=</button>
    </div>
    <p>支持键盘输入 · Enter 计算 · Esc 清空</p>
  </main>
  <script src="calculator.js"></script>
</body>
</html>
